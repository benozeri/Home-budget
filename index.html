<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>כלכלת הבית</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap');
  :root{
    --navy:#132A4C; --navy-dark:#0C1E38; --gold:#C29A55; --gold-dark:#A6813F;
    --paper:#F4F5F7; --ink:#1E2A3F; --slate:#63708A; --line:#E4E7ED;
    --good:#1E8F5E; --warn:#C9832E; --danger:#C13B33;
  }
  *{box-sizing:border-box; font-family:'Heebo',system-ui,sans-serif;}
  body{margin:0; background:var(--paper); color:var(--ink);}
  ::-webkit-scrollbar{display:none;}
  button{cursor:pointer; font-family:inherit;}
  input,select{font-family:inherit;}
  .spinner{width:32px;height:32px;border:3px solid #ddd;border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F5F7;font-family:sans-serif;color:#63708A;font-size:14px;" dir="rtl">
    טוען את האפליקציה...
  </div>
</div>
<div id="fatal-error" style="display:none;direction:rtl;font-family:sans-serif;max-width:480px;margin:24px auto;padding:16px;background:#FBEDEC;border:1px solid #C13B33;border-radius:12px;color:#1E2A3F;font-size:13px;white-space:pre-wrap;"></div>

<script>
  function showFatal(msg){
    var el = document.getElementById("fatal-error");
    el.style.display = "block";
    el.textContent = "שגיאה בטעינת האפליקציה:\n" + msg;
  }
  window.addEventListener("error", function(e){
    showFatal((e.error && e.error.stack) || e.message || String(e));
  });
  window.addEventListener("unhandledrejection", function(e){
    showFatal(String(e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
</script>

<!-- Firebase (ESM) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, where, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBcdzJN-LxwIedaVASTrDOWqBCNmjP-T-E",
    authDomain: "home-budget-management-98628.firebaseapp.com",
    projectId: "home-budget-management-98628",
    storageBucket: "home-budget-management-98628.firebasestorage.app",
    messagingSenderId: "273817873757",
    appId: "1:273817873757:web:7c4eb8817d50df9636ccb4"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.__fb = {
      db, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, getDoc
    };
  } catch (e) {
    window.__fbError = e;
  }
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<!-- React + tooling -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ------------------------- קבועים ------------------------- */
const NAVY="#132A4C", NAVY_DARK="#0C1E38", GOLD="#C29A55", GOLD_DARK="#A6813F";
const PAPER="#F4F5F7", INK="#1E2A3F", SLATE="#63708A", LINE="#E4E7ED";
const GOOD="#1E8F5E", WARN="#C9832E", DANGER="#C13B33";

const CATS_DEFAULT = [
  { id:"c1", name:"דיור ומשכנתא", icon:"🏠" },
  { id:"c2", name:"חשבונות ותשתיות", icon:"💡" },
  { id:"c3", name:"סופר ומזון", icon:"🛒" },
  { id:"c4", name:"תחבורה ורכב", icon:"🚗" },
  { id:"c5", name:"ביטוחים", icon:"🛡️" },
  { id:"c6", name:"בריאות", icon:"⚕️" },
  { id:"c7", name:"חינוך וילדים", icon:"🎒" },
  { id:"c8", name:"בילויים ופנאי", icon:"🎬" },
  { id:"c9", name:"ביגוד והנעלה", icon:"👕" },
  { id:"c10", name:"חיסכון והשקעות", icon:"📈" },
  { id:"c11", name:"הלוואות ואשראי", icon:"💳" },
  { id:"c12", name:"אחר", icon:"📎" },
];
const MONTHS_HE = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

function monthKey(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }
function currency(n){ const v=Number(n)||0; return v.toLocaleString("he-IL",{style:"currency",currency:"ILS",maximumFractionDigits:0}); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nowStamp(){ return new Date().toLocaleString("he-IL",{dateStyle:"short",timeStyle:"medium"}); }
function weekOfMonth(day){ return Math.min(5, Math.ceil(day/7)); }
function uidLocal(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ------------------------- מד כיסוי עגול ------------------------- */
function CoverageDial({ spent, budget, label, icon }){
  const pct = budget>0 ? spent/budget : (spent>0 ? 1.15 : 0);
  const clamped = Math.min(pct, 1.15);
  const size=74, stroke=8, r=(size-stroke)/2, circ=2*Math.PI*r;
  const dash = Math.min(clamped,1)*circ;
  const color = pct>1 ? DANGER : pct>0.85 ? WARN : GOLD;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,width:84,flexShrink:0}}>
      <div style={{position:"relative",width:size,height:size}}>
        <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
          <circle cx={size/2} cy={size/2} r={r} stroke={LINE} strokeWidth={stroke} fill="none"/>
          <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
            strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" style={{transition:"stroke-dasharray .4s ease"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:15,lineHeight:1}}>{icon}</span>
          <span style={{fontSize:10,fontWeight:700,marginTop:2,color}}>{budget>0 ? `${Math.round(pct*100)}%` : "—"}</span>
        </div>
      </div>
      <span style={{fontSize:11,textAlign:"center",lineHeight:1.2,fontWeight:500,color:INK}}>{label}</span>
    </div>
  );
}

/* ------------------------- אפליקציה ראשית ------------------------- */
function App(){
  const [fbError,setFbError]=useState(null);
  const [booting,setBooting]=useState(true);
  const [settings,setSettings]=useState(null);
  const [unlocked,setUnlocked]=useState(false);
  const [activeUser,setActiveUser]=useState(null);
  const [screen,setScreen]=useState("dashboard");

  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth()+1);
  const ym = monthKey(year,month);

  const [monthTx,setMonthTx]=useState([]);
  const [monthBudget,setMonthBudget]=useState({});
  const [monthLog,setMonthLog]=useState([]);
  const [loadingMonth,setLoadingMonth]=useState(true);

  const [showAdd,setShowAdd]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [toast,setToast]=useState(null);

  function showToast(msg,tone="good"){ setToast({msg,tone}); setTimeout(()=>setToast(null),2200); }

  /* --- אתחול Firebase + הרשמה לשינויים בהגדרות --- */
  useEffect(()=>{
    function init(){
      if (window.__fbError){ setFbError(window.__fbError); setBooting(false); return; }
      const { db, doc, onSnapshot } = window.__fb;
      const unsub = onSnapshot(doc(db,"settings","config"), (snap)=>{
        setSettings(snap.exists() ? snap.data() : null);
        setBooting(false);
      }, (err)=>{ setFbError(err); setBooting(false); });
      return unsub;
    }
    if (window.__fb || window.__fbError){ init(); }
    else window.addEventListener("firebase-ready", init, { once:true });
  },[]);

  /* --- הרשמה לתנועות/תקציב/לוג של החודש הנבחר --- */
  useEffect(()=>{
    if (!unlocked || !window.__fb) return;
    setLoadingMonth(true);
    const { db, collection, doc, query, where, onSnapshot } = window.__fb;

    const unsubTx = onSnapshot(query(collection(db,"transactions"), where("ym","==",ym)), (snap)=>{
      const arr = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>a.date.localeCompare(b.date));
      setMonthTx(arr);
      setLoadingMonth(false);
    });
    const unsubBudget = onSnapshot(doc(db,"budgets",ym), (snap)=>{
      setMonthBudget(snap.exists() ? snap.data() : {});
    });
    const unsubLog = onSnapshot(query(collection(db,"logs"), where("ym","==",ym)), (snap)=>{
      const arr = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.tsRaw||0)-(b.tsRaw||0));
      setMonthLog(arr);
    });
    return ()=>{ unsubTx(); unsubBudget(); unsubLog(); };
  },[unlocked, ym]);

  async function appendLog(action, details){
    const { db, collection, addDoc } = window.__fb;
    await addDoc(collection(db,"logs"), { ym, ts:nowStamp(), tsRaw:Date.now(), user:activeUser, action, details:details||"" });
  }

  async function completeSetup({ pin, partnerA, partnerB }){
    const { db, doc, setDoc } = window.__fb;
    await setDoc(doc(db,"settings","config"), {
      pin, partners:[partnerA||"בן/בת זוג 1", partnerB||"בן/בת זוג 2"],
      categories: CATS_DEFAULT, createdAt: nowStamp()
    });
  }

  async function saveTransaction(tx){
    const { db, collection, doc, addDoc, updateDoc } = window.__fb;
    const targetYm = monthKey(...tx.date.split("-").slice(0,2).map(Number));
    const isEdit = !!tx.id;
    const payload = {
      type:tx.type, nature:tx.nature, categoryId:tx.categoryId, category:tx.category,
      amount:Number(tx.amount), date:tx.date, note:tx.note||"", ym:targetYm,
      updatedAt:nowStamp(), updatedBy:activeUser,
    };
    if (isEdit){
      await updateDoc(doc(db,"transactions",tx.id), payload);
    } else {
      payload.createdAt = nowStamp();
      payload.createdBy = activeUser;
      await addDoc(collection(db,"transactions"), payload);
    }
    await appendLog(isEdit?"עדכון תנועה":"הוספת תנועה", `${payload.type==="income"?"הכנסה":"הוצאה"} · ${payload.category} · ${currency(payload.amount)}`);
    showToast(isEdit?"התנועה עודכנה":"התנועה נוספה","good");
  }

  async function deleteTransaction(tx){
    const { db, doc, deleteDoc } = window.__fb;
    await deleteDoc(doc(db,"transactions",tx.id));
    await appendLog("מחיקת תנועה", `${tx.type==="income"?"הכנסה":"הוצאה"} · ${tx.category} · ${currency(tx.amount)}`);
    showToast("התנועה נמחקה","danger");
  }

  async function saveBudget(catId, amount){
    const { db, doc, setDoc } = window.__fb;
    await setDoc(doc(db,"budgets",ym), { [catId]: Number(amount)||0 }, { merge:true });
    await appendLog("עדכון תקציב", `${(settings.categories.find(c=>c.id===catId)||{}).name}: ${currency(amount)}`);
  }

  async function addCategory(name, icon){
    const { db, doc, setDoc, getDoc } = window.__fb;
    const fresh = await getDoc(doc(db,"settings","config"));
    const cur = fresh.data();
    const cats = [...cur.categories, { id:uidLocal(), name, icon: icon||"📎" }];
    await setDoc(doc(db,"settings","config"), { ...cur, categories:cats });
    await appendLog("הוספת קטגוריה", name);
  }
  async function deleteCategory(catId){
    const inUse = monthTx.some(t=>t.categoryId===catId);
    if (inUse){ showToast("לא ניתן למחוק קטגוריה שיש בה תנועות החודש","danger"); return; }
    const { db, doc, setDoc, getDoc } = window.__fb;
    const fresh = await getDoc(doc(db,"settings","config"));
    const cur = fresh.data();
    const cats = cur.categories.filter(c=>c.id!==catId);
    await setDoc(doc(db,"settings","config"), { ...cur, categories:cats });
  }

  const cats = settings?.categories || CATS_DEFAULT;

  const totals = useMemo(()=>{
    const income = monthTx.filter(t=>t.type==="income");
    const expense = monthTx.filter(t=>t.type==="expense");
    const sum = arr=>arr.reduce((a,t)=>a+Number(t.amount||0),0);
    return {
      incomeFixed:sum(income.filter(t=>t.nature==="fixed")),
      incomeVar:sum(income.filter(t=>t.nature==="variable")),
      expenseFixed:sum(expense.filter(t=>t.nature==="fixed")),
      expenseVar:sum(expense.filter(t=>t.nature==="variable")),
      incomeTotal:sum(income), expenseTotal:sum(expense),
    };
  },[monthTx]);

  const perCategory = useMemo(()=> cats.map(c=>{
    const spent = monthTx.filter(t=>t.type==="expense"&&t.categoryId===c.id).reduce((a,t)=>a+Number(t.amount||0),0);
    const budget = monthBudget[c.id]||0;
    return { ...c, spent, budget, over: budget>0 && spent>budget };
  }),[cats, monthTx, monthBudget]);

  const overBudgetCats = perCategory.filter(c=>c.over);
  const totalBudget = perCategory.reduce((a,c)=>a+c.budget,0);
  const remaining = totals.incomeTotal - totals.expenseTotal;

  function exportSheet(kind){
    const wb = XLSX.utils.book_new();
    if (kind==="dashboard"){
      const rows = perCategory.map(c=>({ "קטגוריה":`${c.icon} ${c.name}`, "תקציב חודשי":c.budget, "הוצאה בפועל":c.spent, "יתרה":c.budget-c.spent, "חריגה?":c.over?"כן":"לא" }));
      rows.push({ "קטגוריה":"סה\"כ", "תקציב חודשי":totalBudget, "הוצאה בפועל":totals.expenseTotal, "יתרה":totalBudget-totals.expenseTotal, "חריגה?":"" });
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"]=[{wch:26},{wch:14},{wch:14},{wch:12},{wch:10}]; ws["!views"]=[{RTL:true}];
      XLSX.utils.book_append_sheet(wb, ws, `תקציב ${MONTHS_HE[month-1]}`);
      const summary=[
        {"שורה":"הכנסה קבועה","סכום":totals.incomeFixed},{"שורה":"הכנסה משתנה","סכום":totals.incomeVar},
        {"שורה":"הוצאה קבועה","סכום":totals.expenseFixed},{"שורה":"הוצאה משתנה","סכום":totals.expenseVar},
        {"שורה":"יתרה חודשית","סכום":remaining},
      ];
      const ws2=XLSX.utils.json_to_sheet(summary); ws2["!cols"]=[{wch:20},{wch:14}]; ws2["!views"]=[{RTL:true}];
      XLSX.utils.book_append_sheet(wb, ws2, "תזרים חודשי");
    } else if (kind==="ledger"){
      const rows = monthTx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({
        "תאריך":t.date, "שבוע בחודש":weekOfMonth(Number(t.date.split("-")[2])),
        "סוג":t.type==="income"?"הכנסה":"הוצאה", "אופי":t.nature==="fixed"?"קבוע":"משתנה",
        "קטגוריה":cats.find(c=>c.id===t.categoryId)?.name||t.category||"", "סכום":t.amount,
        "הערה":t.note||"", "הוזן ע\"י":t.createdBy||"",
      }));
      const ws=XLSX.utils.json_to_sheet(rows);
      ws["!cols"]=[{wch:12},{wch:12},{wch:9},{wch:9},{wch:20},{wch:11},{wch:24},{wch:14}]; ws["!views"]=[{RTL:true}];
      XLSX.utils.book_append_sheet(wb, ws, `יומן ${MONTHS_HE[month-1]}`);
    } else if (kind==="log"){
      const rows = monthLog.slice().reverse().map(l=>({ "תאריך ושעה":l.ts, "משתמש":l.user, "פעולה":l.action, "פרטים":l.details }));
      const ws=XLSX.utils.json_to_sheet(rows);
      ws["!cols"]=[{wch:20},{wch:16},{wch:16},{wch:36}]; ws["!views"]=[{RTL:true}];
      XLSX.utils.book_append_sheet(wb, ws, "לוג פעולות");
    }
    const out = XLSX.write(wb,{ bookType:"xlsx", type:"array" });
    const blob = new Blob([out],{ type:"application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`כלכלת-הבית_${kind}_${ym}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast("קובץ האקסל יוצא בהצלחה","good");
  }

  if (booting){
    return <div dir="rtl" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER}}><div className="spinner"/></div>;
  }
  if (fbError){
    return (
      <div dir="rtl" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:NAVY,padding:24}}>
        <div style={{maxWidth:380,width:"100%",background:"white",borderRadius:16,padding:24,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>⚠️</div>
          <h1 style={{fontSize:16,fontWeight:800,color:NAVY}}>שגיאת חיבור למסד הנתונים</h1>
          <p style={{fontSize:13,color:SLATE,marginTop:8}}>{String(fbError.message||fbError)}</p>
        </div>
      </div>
    );
  }
  if (!settings){ return <SetupScreen onComplete={completeSetup}/>; }
  if (!unlocked){ return <LoginScreen settings={settings} onUnlock={(u)=>{setActiveUser(u); setUnlocked(true);}}/>; }

  return (
    <div dir="rtl" style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:PAPER,color:INK}}>
      <div style={{padding:"20px 16px 16px",color:"white",background:`linear-gradient(135deg, ${NAVY} 0%, ${NAVY_DARK} 100%)`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:36,height:36,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:GOLD}}>🛡️</div>
            <div>
              <div style={{fontSize:15,fontWeight:800,lineHeight:1}}>כלכלת הבית</div>
              <div style={{fontSize:11,opacity:0.7,lineHeight:1,marginTop:4}}>שלום, {activeUser}</div>
            </div>
          </div>
          <MonthPicker year={year} month={month} setYear={setYear} setMonth={setMonth}/>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",paddingBottom:96,maxWidth:480,width:"100%",margin:"0 auto"}}>
        {loadingMonth ? (
          <div style={{display:"flex",justifyContent:"center",paddingTop:64}}><div className="spinner"/></div>
        ) : screen==="dashboard" ? (
          <Dashboard totals={totals} remaining={remaining} totalBudget={totalBudget} perCategory={perCategory}
            overBudgetCats={overBudgetCats} monthLabel={`${MONTHS_HE[month-1]} ${year}`} onExport={()=>exportSheet("dashboard")}/>
        ) : screen==="ledger" ? (
          <Ledger monthTx={monthTx} cats={cats} onEdit={(t)=>{setEditTx(t); setShowAdd(true);}} onDelete={deleteTransaction} onExport={()=>exportSheet("ledger")}/>
        ) : screen==="budget" ? (
          <BudgetScreen cats={cats} monthBudget={monthBudget} onSaveBudget={saveBudget} onAddCategory={addCategory} onDeleteCategory={deleteCategory}/>
        ) : (
          <LogScreen log={monthLog} onExport={()=>exportSheet("log")}/>
        )}
      </div>

      <button onClick={()=>{setEditTx(null); setShowAdd(true);}}
        style={{position:"fixed",left:"50%",transform:"translateX(-50%)",bottom:78,width:56,height:56,borderRadius:"50%",
        boxShadow:"0 6px 16px rgba(0,0,0,.25)",display:"flex",alignItems:"center",justifyContent:"center",border:"none",background:GOLD,fontSize:26}}>
        ➕
      </button>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:`1px solid ${LINE}`,maxWidth:480,width:"100%",margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-around",alignItems:"center",padding:"8px 0"}}>
          <NavBtn icon="🏠" label="דשבורד" active={screen==="dashboard"} onClick={()=>setScreen("dashboard")}/>
          <NavBtn icon="📒" label="יומן" active={screen==="ledger"} onClick={()=>setScreen("ledger")}/>
          <div style={{width:56}}/>
          <NavBtn icon="📊" label="תקציב" active={screen==="budget"} onClick={()=>setScreen("budget")}/>
          <NavBtn icon="🧾" label="לוג" active={screen==="log"} onClick={()=>setScreen("log")}/>
        </div>
      </div>

      {showAdd && (
        <TxModal cats={cats} initial={editTx} onClose={()=>{setShowAdd(false); setEditTx(null);}}
          onSave={async(tx)=>{ await saveTransaction(tx); setShowAdd(false); setEditTx(null); }}/>
      )}
      {toast && (
        <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:50,padding:"8px 16px",borderRadius:999,
          color:"white",fontSize:13,fontWeight:600,boxShadow:"0 4px 12px rgba(0,0,0,.2)",background:toast.tone==="danger"?DANGER:NAVY_DARK}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

/* ------------------------- מסך הגדרה ראשונית ------------------------- */
function SetupScreen({ onComplete }){
  const [pin,setPin]=useState(""); const [a,setA]=useState(""); const [b,setB]=useState(""); const [busy,setBusy]=useState(false);
  const valid = pin.length===4 && a.trim() && b.trim();
  return (
    <div dir="rtl" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:NAVY}}>
      <div style={{width:"100%",maxWidth:380,background:"white",borderRadius:16,padding:24,boxShadow:"0 20px 50px rgba(0,0,0,.3)"}} className="fade-in">
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:20}}>
          <div style={{width:56,height:56,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12,background:GOLD,fontSize:26}}>🛡️</div>
          <h1 style={{fontSize:18,fontWeight:800,color:NAVY,margin:0}}>הקמת כלכלת הבית</h1>
          <p style={{fontSize:12,marginTop:6,textAlign:"center",color:SLATE}}>הגדירו קוד כניסה ושמות בני הזוג. הקישור הזה ישותף רק ביניכם.</p>
        </div>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>שם בן/בת זוג 1</label>
        <input value={a} onChange={e=>setA(e.target.value)} placeholder="לדוגמה: גיא"
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:14}}/>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>שם בן/בת זוג 2</label>
        <input value={b} onChange={e=>setB(e.target.value)} placeholder="לדוגמה: השם של זוגתך"
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:14}}/>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>קוד כניסה בן 4 ספרות</label>
        <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,4))} inputMode="numeric"
          placeholder="••••" style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:16,fontSize:14,textAlign:"center",letterSpacing:6}}/>
        <button disabled={!valid||busy} onClick={async()=>{setBusy(true); await onComplete({pin,partnerA:a,partnerB:b});}}
          style={{width:"100%",padding:"12px 0",borderRadius:12,fontWeight:700,color:"white",border:"none",background:NAVY,opacity:(!valid||busy)?0.4:1}}>
          {busy?"יוצר...":"יצירת המערכת"}
        </button>
      </div>
    </div>
  );
}

/* ------------------------- מסך כניסה ------------------------- */
function LoginScreen({ settings, onUnlock }){
  const [who,setWho]=useState(null); const [pin,setPin]=useState(""); const [err,setErr]=useState("");
  return (
    <div dir="rtl" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:NAVY}}>
      <div style={{width:"100%",maxWidth:380,background:"white",borderRadius:16,padding:24,boxShadow:"0 20px 50px rgba(0,0,0,.3)"}} className="fade-in">
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:20}}>
          <div style={{width:56,height:56,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12,background:GOLD,fontSize:24}}>🔒</div>
          <h1 style={{fontSize:18,fontWeight:800,color:NAVY,margin:0}}>כלכלת הבית</h1>
          <p style={{fontSize:12,marginTop:6,color:SLATE}}>מי נכנס עכשיו?</p>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {settings.partners.map(p=>(
            <button key={p} onClick={()=>setWho(p)}
              style={{flex:1,padding:"12px 0",borderRadius:12,border:`1px solid ${who===p?GOLD:LINE}`,fontSize:14,fontWeight:600,
              display:"flex",flexDirection:"column",alignItems:"center",gap:4,background:who===p?"#FBF3E7":"white",color:NAVY}}>
              👤 {p}
            </button>
          ))}
        </div>
        <input value={pin} onChange={e=>{setPin(e.target.value.replace(/\D/g,"").slice(0,4)); setErr("");}}
          inputMode="numeric" type="password" placeholder="קוד כניסה"
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:8,fontSize:14,textAlign:"center",letterSpacing:6}}/>
        {err && <div style={{fontSize:12,marginBottom:8,color:DANGER}}>{err}</div>}
        <button disabled={!who||pin.length!==4}
          onClick={()=>{ if (pin===settings.pin) onUnlock(who); else setErr("קוד שגוי, נסו שוב"); }}
          style={{width:"100%",padding:"12px 0",borderRadius:12,fontWeight:700,color:"white",border:"none",background:NAVY,opacity:(!who||pin.length!==4)?0.4:1}}>
          כניסה
        </button>
      </div>
    </div>
  );
}

/* ------------------------- בורר חודש/שנה ------------------------- */
function MonthPicker({ year, month, setYear, setMonth }){
  function shift(delta){ let m=month+delta, y=year; if(m<1){m=12;y-=1;} if(m>12){m=1;y+=1;} setMonth(m); setYear(y); }
  return (
    <div style={{display:"flex",alignItems:"center",gap:4,background:"rgba(255,255,255,.1)",borderRadius:999,padding:"4px 8px"}}>
      <button onClick={()=>shift(1)} style={{background:"none",border:"none",color:"white",fontSize:14,padding:4}}>›</button>
      <span style={{fontSize:12,fontWeight:600,minWidth:68,textAlign:"center",color:"white"}}>{MONTHS_HE[month-1]} {year}</span>
      <button onClick={()=>shift(-1)} style={{background:"none",border:"none",color:"white",fontSize:14,padding:4}}>‹</button>
    </div>
  );
}
function NavBtn({ icon, label, active, onClick }){
  return (
    <button onClick={onClick} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 8px",background:"none",border:"none",color:active?NAVY:SLATE}}>
      <span style={{fontSize:18}}>{icon}</span>
      <span style={{fontSize:10,fontWeight:600}}>{label}</span>
    </button>
  );
}

/* ------------------------- דשבורד ------------------------- */
function Dashboard({ totals, remaining, totalBudget, perCategory, overBudgetCats, monthLabel, onExport }){

    <div style={{padding:"16px 16px 0",display:"flex",flexDirection:"column",gap:16}} className="fade-in">
      <div style={{borderRadius:16,padding:16,color:"white",background:`linear-gradient(135deg, ${NAVY} 0%, ${NAVY_DARK} 100%)`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11,opacity:0.7}}>תזרים חודשי · {monthLabel}</div>
            <div style={{fontSize:24,fontWeight:800,marginTop:4,color:remaining>=0?"#8FE3B8":"#F4A6A0"}}>{currency(remaining)}</div>
          </div>
          <span style={{fontSize:22}}>💰</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12,fontSize:12}}>
          <div style={{background:"rgba(255,255,255,.1)",borderRadius:8,padding:8}}>
            <div style={{opacity:0.7}}>▲ הכנסות</div>
            <div style={{fontWeight:700,marginTop:2}}>{currency(totals.incomeTotal)}</div>
          </div>
          <div style={{background:"rgba(255,255,255,.1)",borderRadius:8,padding:8}}>
            <div style={{opacity:0.7}}>▼ הוצאות</div>
            <div style={{fontWeight:700,marginTop:2}}>{currency(totals.expenseTotal)}</div>
          </div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <MiniCard title="הכנסה קבועה" value={totals.incomeFixed} tone="good"/>
        <MiniCard title="הכנסה משתנה" value={totals.incomeVar} tone="good"/>
        <MiniCard title="הוצאה קבועה" value={totals.expenseFixed} tone="danger"/>

          <div style={{display:"flex",alignItems:"center",gap:8,fontWeight:700,fontSize:14,marginBottom:4,color:DANGER}}>⚠️ חריגה מהתקציב</div>
          {overBudgetCats.map(c=>(
            <div key={c.id} style={{fontSize:12,display:"flex",justifyContent:"space-between",padding:"2px 0",color:INK}}>
              <span>{c.icon} {c.name}</span>
              <span style={{fontWeight:600,color:DANGER}}>+{currency(c.spent-c.budget)}</span>
            </div>
          ))}
        </div>
      )}

      <div>
        <div style={{fontSize:14,fontWeight:700,marginBottom:8,color:NAVY}}>מדי תקציב לפי קטגוריה</div>
        <div style={{display:"flex",gap:12,overflowX:"auto",paddingBottom:4}}>
          {perCategory.map(c=><CoverageDial key={c.id} spent={c.spent} budget={c.budget} label={c.name} icon={c.icon}/>)}
        </div>
      </div>

      <button onClick={onExport} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"12px 0",
        borderRadius:12,border:`1px solid ${GOLD}`,fontWeight:600,fontSize:13,color:NAVY,background:"white",marginBottom:16}}>
        ⬇️ ייצוא מסך זה לאקסל

function MiniCard({ title, value, tone }){
  const color = tone==="good"?GOOD:DANGER;
  return (
    <div style={{background:"white",borderRadius:12,padding:12,border:`1px solid ${LINE}`}}>
      <div style={{fontSize:11,color:SLATE}}>{title}</div>
      <div style={{fontSize:15,fontWeight:800,marginTop:2,color}}>{currency(value)}</div>
    </div>
  );
}

/* ------------------------- יומן שבועי ------------------------- */
function Ledger({ monthTx, cats, onEdit, onDelete, onExport }){
  const weeks = useMemo(()=>{
    const grouped={};
    monthTx.forEach(t=>{ const w=weekOfMonth(Number(t.date.split("-")[2])); grouped[w]=grouped[w]||[]; grouped[w].push(t); });
    return Object.keys(grouped).sort((a,b)=>a-b).map(w=>({week:Number(w), items:grouped[w].sort((a,b)=>a.date.localeCompare(b.date))}));
  },[monthTx]);

  return (
    <div style={{padding:"16px 16px 0",display:"flex",flexDirection:"column",gap:16}} className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:14,fontWeight:700,color:NAVY}}>יומן תנועות שבועי</div>
        <button onClick={onExport} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:600,background:"none",border:"none",color:NAVY}}>⬇️ אקסל</button>
      </div>
      {monthTx.length===0 && <div style={{textAlign:"center",padding:"64px 0",fontSize:14,color:SLATE}}>עדיין אין תנועות החודש. הקישו על כפתור ה-+ להוספת הכנסה או הוצאה.</div>}
      {weeks.map(({week,items})=>{
        const sum = items.reduce((a,t)=>a+(t.type==="expense"?-t.amount:t.amount),0);
        return (
          <div key={week} style={{background:"white",borderRadius:12,border:`1px solid ${LINE}`,overflow:"hidden"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#F0F2F5"}}>
              <span style={{fontSize:12,fontWeight:700,color:NAVY}}>שבוע {week}</span>
              <span style={{fontSize:12,fontWeight:700,color:sum>=0?GOOD:DANGER}}>{currency(sum)}</span>
            </div>
            {items.map(t=>(
              <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderTop:`1px solid ${LINE}`}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>{cats.find(c=>c.id===t.categoryId)?.icon||"📎"}</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{t.category}</div>
                    <div style={{fontSize:10,color:SLATE}}>{t.date} · {t.nature==="fixed"?"קבוע":"משתנה"} · {t.createdBy}{t.note?` · ${t.note}`:""}</div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:13,fontWeight:700,color:t.type==="income"?GOOD:DANGER}}>{t.type==="income"?"+":"-"}{currency(t.amount)}</span>
                  <button onClick={()=>onEdit(t)} style={{background:"none",border:"none",color:SLATE,fontSize:14}}>✎</button>
                  <button onClick={()=>onDelete(t)} style={{background:"none",border:"none",color:DANGER,fontSize:14}}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

/* ------------------------- תקציב וקטגוריות ------------------------- */
function BudgetScreen({ cats, monthBudget, onSaveBudget, onAddCategory, onDeleteCategory }){
  const [drafts,setDrafts]=useState({});
  const [newCat,setNewCat]=useState("");
  return (
    <div style={{padding:"16px 16px 0",display:"flex",flexDirection:"column",gap:12}} className="fade-in">
      <div style={{fontSize:14,fontWeight:700,color:NAVY}}>תקציב מינימלי לפי קטגוריה</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {cats.map(c=>(
          <div key={c.id} style={{background:"white",borderRadius:12,border:`1px solid ${LINE}`,padding:12,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>{c.icon}</span>
            <span style={{flex:1,fontSize:13,fontWeight:600}}>{c.name}</span>
            <input type="number" defaultValue={monthBudget[c.id]||""} placeholder="0"
              onChange={e=>setDrafts(d=>({...d,[c.id]:e.target.value}))}
              style={{width:96,border:`1px solid ${LINE}`,borderRadius:8,padding:"4px 8px",fontSize:13,textAlign:"left"}}/>
            <button onClick={()=>onSaveBudget(c.id, drafts[c.id]??monthBudget[c.id]??0)}
              style={{padding:6,borderRadius:8,border:"none",background:NAVY,color:"white"}}>✓</button>
            <button onClick={()=>onDeleteCategory(c.id)} style={{background:"none",border:"none",color:DANGER,padding:6}}>🗑️</button>
          </div>
        ))}
      </div>
      <div style={{background:"white",borderRadius:12,border:`1px solid ${LINE}`,padding:12,display:"flex",alignItems:"center",gap:8}}>
        <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="קטגוריה חדשה..."
          style={{flex:1,border:`1px solid ${LINE}`,borderRadius:8,padding:"6px 8px",fontSize:13}}/>
        <button disabled={!newCat.trim()} onClick={()=>{onAddCategory(newCat.trim()); setNewCat("");}}
          style={{padding:"6px 12px",borderRadius:8,color:"white",fontSize:12,fontWeight:700,border:"none",background:GOLD_DARK,opacity:!newCat.trim()?0.4:1}}>
          הוספה
        </button>
      </div>
    </div>
  );
}

/* ------------------------- לוג פעולות ------------------------- */
function LogScreen({ log, onExport }){
  return (
    <div style={{padding:"16px 16px 0",display:"flex",flexDirection:"column",gap:12}} className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:14,fontWeight:700,color:NAVY}}>לוג פעולות</div>
        <button onClick={onExport} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:600,background:"none",border:"none",color:NAVY}}>⬇️ אקסל</button>
      </div>
      {log.length===0 && <div style={{textAlign:"center",padding:"64px 0",fontSize:14,color:SLATE}}>אין עדיין פעולות רשומות החודש.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {log.slice().reverse().map(l=>(
          <div key={l.id} style={{background:"white",borderRadius:12,border:`1px solid ${LINE}`,padding:12}}>

              <span style={{fontSize:10,color:SLATE}}>{l.ts}</span>
            </div>
            <div style={{fontSize:12,marginTop:2,color:INK}}>{l.details}</div>
            <div style={{fontSize:10,marginTop:4,color:SLATE}}>בוצע ע"י {l.user}</div>
          </div>
        ))}
      </div>
    </div>

}

/* ------------------------- מודל הוספה/עריכה ------------------------- */
function TxModal({ cats, initial, onClose, onSave }){
  const [type,setType]=useState(initial?.type||"expense");
  const [nature,setNature]=useState(initial?.nature||"variable");
  const [categoryId,setCategoryId]=useState(initial?.categoryId||cats[0]?.id);
  const [amount,setAmount]=useState(initial?.amount||"");
  const [date,setDate]=useState(initial?.date||todayISO());
  const [note,setNote]=useState(initial?.note||"");
  const [saving,setSaving]=useState(false);
  const valid = Number(amount)>0 && categoryId && date;

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center",background:"rgba(0,0,0,.4)"}}>
      <div dir="rtl" onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,background:"white",borderRadius:"16px 16px 0 0",padding:20,maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:800,color:NAVY,margin:0}}>{initial?"עריכת תנועה":"תנועה חדשה"}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:SLATE}}>✕</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[["expense","הוצאה"],["income","הכנסה"]].map(([v,l])=>(
            <button key={v} onClick={()=>setType(v)} style={{flex:1,padding:"8px 0",borderRadius:12,fontSize:14,fontWeight:700,
              border:`1px solid ${type===v?(v==="income"?GOOD:DANGER):LINE}`,
              color:type===v?(v==="income"?GOOD:DANGER):SLATE, background:type===v?(v==="income"?"#EAF7F0":"#FBEDEC"):"white"}}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[["fixed","קבוע"],["variable","משתנה"]].map(([v,l])=>(
            <button key={v} onClick={()=>setNature(v)} style={{flex:1,padding:"8px 0",borderRadius:12,fontSize:13,fontWeight:600,
              border:`1px solid ${nature===v?GOLD:LINE}`, color:nature===v?NAVY:SLATE, background:nature===v?"#FBF3E7":"white"}}>{l}</button>
          ))}
        </div>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>קטגוריה</label>
        <select value={categoryId} onChange={e=>setCategoryId(e.target.value)}
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:14}}>
          {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
        </select>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>סכום (₪)</label>
        <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:14}}/>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>תאריך</label>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)}
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:14}}/>
        <label style={{fontSize:12,fontWeight:600,marginBottom:4,display:"block",color:SLATE}}>הערה (לא חובה)</label>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="פירוט קצר..."
          style={{width:"100%",border:`1px solid ${LINE}`,borderRadius:8,padding:"8px 12px",marginBottom:16,fontSize:14}}/>
        <button disabled={!valid||saving} onClick={async()=>{
            setSaving(true);
            const cat = cats.find(c=>c.id===categoryId);
            await onSave({ id:initial?.id, type, nature, categoryId, category:cat?.name||"", amount:Number(amount), date, note });
          }}
          style={{width:"100%",padding:"12px 0",borderRadius:12,fontWeight:700,color:"white",border:"none",background:NAVY,opacity:(!valid||saving)?0.4:1}}>
          {saving?"שומר...":"שמירה"}
        </button>
      </div>
    </div>
  );
}

root.render(<App/>);
</script>
